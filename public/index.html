<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0f1a">
<title>Traitor Protocol</title>
<style>
:root{--bg:#0b0f1a;--panel:#141b2d;--panel2:#1b2540;--line:#27345a;--txt:#e8ecf8;--dim:#8d99bb;--red:#ff4d6d;--blue:#4dabf7;--green:#51cf66;--yellow:#ffd43b;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%;overscroll-behavior:none}
body{background:radial-gradient(900px 500px at 50% -10%,#1a2750 0,transparent 70%),var(--bg)}
#screen{max-width:520px;margin:0 auto;padding:12px 14px 40px;min-height:100vh}
h1{font-size:30px;margin:0;letter-spacing:.14em;text-transform:uppercase}
h1 b{color:var(--red)}
h2{font-size:15px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
input{width:100%;background:#0e1424;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:13px;font-size:17px;outline:none}
input:focus{border-color:var(--blue)}
button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:600;cursor:pointer;transition:transform .08s,opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn{background:linear-gradient(180deg,#3b82f6,#2563eb);border-color:#3b82f6;width:100%;font-size:17px;padding:14px}
.btn.red{background:linear-gradient(180deg,#ff5c7a,#e0314f);border-color:#ff5c7a}
.btn.green{background:linear-gradient(180deg,#51cf66,#2f9e44);border-color:#51cf66;color:#04210b}
.btn.ghost{background:transparent}
.sm{padding:8px 11px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.dim{color:var(--dim)}
.small{font-size:13px}
.center{text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 7px;font-size:14px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 8px currentColor}
.code{font-size:56px;font-weight:900;letter-spacing:.18em;text-align:center;color:var(--yellow);text-shadow:0 0 24px #ffd43b66}
.badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em}
.b-killer{background:#ff4d6d33;color:var(--red)}.b-detective{background:#4dabf733;color:var(--blue)}.b-innocent{background:#51cf6633;color:var(--green)}
details summary{cursor:pointer;color:var(--dim);font-weight:600}
details p,details li{color:#b9c3e0;font-size:14px;line-height:1.5}
.err{color:var(--red);min-height:20px;font-size:14px;margin-top:6px}
/* HUD */
.hud{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pbar{flex:1;height:14px;background:#0e1424;border:1px solid var(--line);border-radius:99px;overflow:hidden;position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#51cf66,#a9e34b);transition:width .5s;box-shadow:0 0 12px #51cf66aa}
.map{width:100%;aspect-ratio:1;background:#0c1222;border:1px solid var(--line);border-radius:var(--r)}
.map text{fill:#9fb0dd;font-size:3.3px;text-anchor:middle;font-weight:600;pointer-events:none}
.map .edge{stroke:#26345e;stroke-width:1.1}
.map .node{fill:#16203a;stroke:#2c3d6e;stroke-width:.7}
.map .node.me{fill:#17314f;stroke:var(--blue);stroke-width:1.2;filter:drop-shadow(0 0 2px var(--blue))}
.map g.go{cursor:pointer}
.map g.go .node{stroke:var(--green);stroke-width:1;animation:pulse 1.2s infinite}
.map g.go.disabled{opacity:.45;pointer-events:none}
@keyframes pulse{50%{stroke-width:2}}
.travel{height:5px;background:#0e1424;border-radius:99px;overflow:hidden;margin:8px 0}
.travel i{display:block;height:100%;width:0;background:var(--blue)}
.rowitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1d2745}
.rowitem:last-child{border:0}
.rowitem .grow{flex:1;display:flex;align-items:center;gap:8px;font-weight:600}
.task{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.task.done{opacity:.45;text-decoration:line-through}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rolebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:#070a14ee;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px)}
.ovbox{width:100%;max-width:440px}
.reveal{text-align:center;animation:pop .6s}
.reveal .big{font-size:42px;font-weight:900;letter-spacing:.06em;margin:6px 0}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.toasts{position:fixed;top:8px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#1b2540f2;border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 14px;border-radius:10px;max-width:92%;font-size:14px;animation:slide .3s;box-shadow:0 6px 24px #0008}
.toast.good{border-left-color:var(--green)}.toast.bad,.toast.kill{border-left-color:var(--red)}
@keyframes slide{from{transform:translateY(-20px);opacity:0}}
#flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0}
#flash.on{animation:flash 1.1s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.blackout{position:fixed;inset:0;background:#000d;z-index:40;pointer-events:none;display:none;align-items:flex-start;justify-content:center;padding-top:60px;font-weight:800;letter-spacing:.2em;color:var(--red)}
/* minijuegos */
.mini h3{margin:0 0 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.grid3 button{aspect-ratio:1;font-size:28px;background:#1d2b52}
.grid3 button.ok{background:#2f9e44;border-color:#51cf66}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.reflex{width:190px;height:190px;border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;background:#e0314f;border:4px solid #fff3;user-select:none}
.reflex.go{background:#2f9e44}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pads button{height:92px;opacity:.45;border-radius:16px}
.pads button.lit{opacity:1;filter:brightness(1.4);box-shadow:0 0 24px currentColor}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.opts button{font-size:22px;padding:18px}
.q{font-size:38px;font-weight:900;text-align:center;margin:14px 0}
/* reunión */
.chat{height:210px;overflow-y:auto;background:#0e1424;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}
.chat div{margin:3px 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pcard.dead{opacity:.35}
.pcard.mine{border-color:var(--yellow)}
.pcard .nm{display:flex;align-items:center;gap:6px;font-weight:700}
.hint{background:#ffd43b14;border:1px solid #ffd43b44;border-radius:10px;padding:8px 10px;font-size:13px;color:#ffe9a3;margin:4px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:var(--yellow)}
.rline{opacity:0;animation:slide .5s forwards}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1d2745}
.rank .n{width:24px;font-weight:900;color:var(--dim)}
.rank .sc{margin-left:auto;font-weight:900;font-size:18px}
.winner{font-size:34px;font-weight:900;text-align:center;letter-spacing:.05em;margin:10px 0 2px}
</style>
</head>
<body>
<div id="screen"></div>
<div id="mini"></div>
<div id="reveal"></div>
<div class="toasts" id="toasts"></div>
<div id="flash"></div>
<div class="blackout" id="bo">⚡ APAGÓN ⚡</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let S = null, off = 0, sess = null, es = null, lastNote = 0, lastPhase = null, mini = null;
try { sess = JSON.parse(localStorage.getItem('tp') || 'null'); } catch (e) { }
const now = () => Date.now() + off;
const ROLE = {
  killer: { t: 'ERES TRAIDOR', c: 'var(--red)', i: '🔪', d: 'Elimina agentes sin que te descubran: mata en la misma sala (enfriamiento entre muertes), provoca apagones y finge hacer tareas. Ganáis cuando los traidores igualéis en número a los demás.' },
  detective: { t: 'ERES EL DETECTIVE', c: 'var(--blue)', i: '🕵️', d: 'Encuentra y abate a los traidores. Puedes escanear (75% fiable) y disparar a alguien de tu sala. ¡Si disparas a un inocente, mueres!' },
  innocent: { t: 'ERES AGENTE', c: 'var(--green)', i: '🛡️', d: 'Completa tareas por la base y descubre a los traidores en las reuniones. Ganáis si se llena la barra de tareas o si todos los traidores caen.' },
};
const roomName = id => S.map.rooms.find(r => r.id === id)?.name || '?';
const pById = id => S.players.find(p => p.id === id);
const chip = p => `<span class="chip"><i class="dot" style="background:${p.color};color:${p.color}"></i>${esc(p.name)}</span>`;
const badge = r => r ? `<span class="badge b-${r}">${{ killer: 'Traidor', detective: 'Detective', innocent: 'Agente' }[r]}</span>` : '';

// ---------- audio / vibración ----------
let ac = null;
function beep(f = 440, d = .15, t = 'sine', v = .08) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch (e) { }
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };
function flash(color) { const f = $('#flash'); f.style.background = color; f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); }
function toast(text, kind = 'info') {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = text; $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

// ---------- red ----------
async function post(url, data) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  return r.json();
}
async function api(type, extra = {}) {
  if (!sess) return;
  try {
    const r = await post('/api/act', { ...sess, type, ...extra });
    if (r.error) toast(r.error, 'bad');
    return r;
  } catch (e) { toast('Sin conexión…', 'bad'); }
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/stream?code=${sess.code}&pid=${sess.pid}&token=${sess.token}`);
  es.onmessage = e => { S = JSON.parse(e.data); off = S.now - Date.now(); onState(); };
  es.onerror = () => { if (es.readyState === 2) { es.close(); es = null; if (!S) leaveLocal(); else setTimeout(() => sess && connect(), 1500); } };
}
function leaveLocal() { try { localStorage.removeItem('tp'); } catch (e) { } sess = null; S = null; closeMini(); $('#reveal').innerHTML = ''; renderHome(); }
async function enter(kind) {
  const name = $('#name').value.trim(), code = ($('#jcode')?.value || '').trim().toUpperCase();
  if (!name) return $('#err').textContent = 'Escribe tu nombre.';
  beep(520, .08);
  const r = await post(kind === 'create' ? '/api/create' : '/api/join', { name, code });
  if (r.error) return $('#err').textContent = r.error;
  sess = r; try { localStorage.setItem('tp', JSON.stringify(r)); localStorage.setItem('tpname', name); } catch (e) { }
  connect();
}

// ---------- estado ----------
function onState() {
  // avisos
  S.me.notes.filter(n => n.id > lastNote).forEach(n => {
    lastNote = Math.max(lastNote, n.id); toast(n.text, n.kind);
    if (n.kind === 'kill') { flash('#e0314f'); vib([300, 100, 300]); beep(110, .6, 'sawtooth', .15); }
    else if (n.kind === 'bad') { beep(200, .25, 'square', .06); vib(120); }
    else if (n.kind === 'good') beep(760, .15);
  });
  if (lastPhase !== S.phase) {
    if (S.phase === 'meeting') { flash('#ffd43b'); vib([200, 100, 200, 100, 400]); beep(330, .5, 'square', .1); closeMini(); }
    if (S.phase === 'result') { beep(180, .8, 'sawtooth', .1); }
    if (S.phase === 'end') { beep(S.end.winner === (S.me.role === 'killer' ? 'killers' : 'innocents') ? 880 : 150, .8, 'triangle', .12); }
    if (S.phase === 'reveal') { beep(300, .6, 'triangle', .1); }
    lastPhase = S.phase;
  }
  render();
}
function render() {
  switch (S.phase) {
    case 'lobby': return renderLobby();
    case 'reveal': case 'play': return renderGame();
    case 'meeting': case 'result': return renderMeeting();
    case 'end': return renderEnd();
  }
}
function mount(name) { const s = $('#screen'); if (s.dataset.n === name) return false; s.dataset.n = name; s.innerHTML = ''; return true; }
function setHTML(name, html) { mount(name); $('#screen').innerHTML = html; }

// ---------- HOME ----------
function renderHome() {
  const q = new URLSearchParams(location.search).get('c') || '';
  let saved = ''; try { saved = localStorage.getItem('tpname') || ''; } catch (e) { }
  $('#reveal').innerHTML = ''; $('#bo').style.display = 'none';
  $('#screen').dataset.n = 'home';
  $('#screen').innerHTML = `
  <div class="center" style="margin:26px 0 18px"><div style="font-size:54px">🕵️</div><h1>Traitor <b>Protocol</b></h1><div class="dim small" style="margin-top:6px">Engaña, deduce y sobrevive · 4–10 jugadores</div></div>
  <div class="card">
    <input id="name" maxlength="12" placeholder="Tu nombre" value="${esc(saved)}" autocomplete="off">
    <div style="height:10px"></div>
    <button class="btn" onclick="enter('create')">Crear sala</button>
    <div class="dim center small" style="margin:12px 0">— o únete con un código —</div>
    <div class="row"><input id="jcode" maxlength="4" placeholder="CÓDIGO" value="${esc(q.toUpperCase())}" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;flex:2" autocomplete="off"><button class="btn green" onclick="enter('join')" style="flex:1">Unirse</button></div>
    <div class="err" id="err"></div>
  </div>
  <div class="card"><details><summary>📖 Cómo se juega</summary>
    <ul>
      <li><b>Los agentes</b> hacen tareas en las salas de la base. La barra verde sube con cada tarea.</li>
      <li><b>Los traidores</b> matan en la misma sala (con enfriamiento), provocan apagones y fingen tareas.</li>
      <li><b>El detective</b> escanea sospechosos (75% fiable) y puede disparar: abate a un traidor… o muere si falla.</li>
      <li>Al ver un cuerpo, pulsa <b>Reportar</b>. Habrá reunión: hablad en el chat y <b>votad</b> a quién expulsar.</li>
      <li><b>Ganan los agentes</b> si completan todas las tareas o eliminan a todos los traidores. <b>Ganan los traidores</b> si igualan en número a los demás.</li>
      <li>Los muertos siguen como fantasmas: pueden moverse y hacer tareas.</li>
      <li>Cada jugador suma puntos personales; al final hay ranking.</li>
    </ul></details></div>`;
}

// ---------- LOBBY ----------
function renderLobby() {
  const n = S.players.length, host = S.hostId === S.me.id;
  const nk = n <= 5 ? 1 : n <= 8 ? 2 : 3;
  const link = location.origin + '/?c=' + S.code;
  setHTML('lobby', `
  <div class="center dim small" style="margin-top:14px">CÓDIGO DE SALA</div>
  <div class="code">${S.code}</div>
  <div class="row" style="margin:8px 0"><button class="sm" onclick="copyLink()">📋 Copiar enlace</button><button class="sm" onclick="shareLink()">📤 Compartir</button></div>
  <div class="card"><h2>Jugadores ${n}/${S.max}</h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${S.players.map(p => `<span class="chip" style="${p.connected ? '' : 'opacity:.4'}"><i class="dot" style="background:${p.color};color:${p.color}"></i>${esc(p.name)}${p.id === S.hostId ? ' 👑' : ''}</span>`).join('')}</div>
    <div class="dim small" style="margin-top:12px">${n >= S.min ? `Con ${n} jugadores: <b style="color:var(--red)">${nk} traidor${nk > 1 ? 'es' : ''}</b>, <b style="color:var(--blue)">1 detective</b> y ${n - nk - 1} agentes.` : `Faltan ${S.min - n} jugador(es) para empezar (mínimo ${S.min}).`}</div>
  </div>
  ${host ? `<button class="btn red" ${n < S.min ? 'disabled' : ''} onclick="api('start')">▶ Iniciar partida</button>` : `<div class="center dim">Esperando a que el anfitrión inicie…</div>`}
  <div style="height:10px"></div><button class="btn ghost" onclick="leave()">Salir</button>`);
}
function copyLink() { const l = location.origin + '/?c=' + S.code; (navigator.clipboard?.writeText(l) || Promise.reject()).then(() => toast('Enlace copiado', 'good')).catch(() => prompt('Copia el enlace:', l)); }
function shareLink() { const l = location.origin + '/?c=' + S.code; navigator.share ? navigator.share({ title: 'Traitor Protocol', text: 'Únete a mi sala: ' + S.code, url: l }).catch(() => { }) : copyLink(); }
async function leave() { if (!confirm('¿Salir de la partida?')) return; await api('leave'); if (es) es.close(); leaveLocal(); }

// ---------- JUEGO ----------
function actBtn(label, ready, onclick, cls = '') {
  return `<button class="sm ${cls}" data-ready="${ready}" data-label="${label}" onclick="${onclick}">${label}</button>`;
}
function renderGame() {
  const me = S.me, ghost = !me.alive, role = me.role;
  const pr = S.progress, pct = pr.total ? Math.round(100 * pr.done / pr.total) : 0;
  const cur = me.room, adjIds = cur ? S.map.edges.filter(e => e.includes(cur)).map(e => e[0] === cur ? e[1] : e[0]) : [];
  const myPending = me.tasks.filter(t => !t.done);
  // mapa
  const R = id => S.map.rooms.find(r => r.id === id);
  let svg = S.map.edges.map(([a, b]) => `<line class="edge" x1="${R(a).x}" y1="${R(a).y}" x2="${R(b).x}" y2="${R(b).y}"/>`).join('');
  if (me.moving) { const a = R(me.from), b = R(me.moving.to); svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#4dabf7" stroke-width="1.6" stroke-dasharray="2 2"/><circle id="trav" r="2.6" fill="#4dabf7" cx="${a.x}" cy="${a.y}" data-a="${a.x},${a.y}" data-b="${b.x},${b.y}"/>`; }
  svg += S.map.rooms.map(r => {
    const go = adjIds.includes(r.id) && !me.moving && S.phase === 'play';
    const hasTask = myPending.some(t => t.room === r.id);
    const body = S.bodies.some(b => b.room === r.id);
    const gdots = ghost ? S.players.filter(p => p.room === r.id) : [];
    return `<g class="${go ? 'go' : ''}" ${go ? `onclick="move('${r.id}')"` : ''}>
      <circle class="node ${cur === r.id ? 'me' : ''}" cx="${r.x}" cy="${r.y}" r="6.2"/>
      ${hasTask ? `<text x="${r.x}" y="${r.y + 1.5}" style="font-size:5px;fill:#ffd43b">★</text>` : ''}
      ${body ? `<text x="${r.x + 5}" y="${r.y - 4}" style="font-size:5px">☠️</text>` : ''}
      ${cur === r.id ? `<circle cx="${r.x}" cy="${r.y}" r="2" fill="${S.players.find(p => p.id === me.id).color}"/>` : ''}
      ${gdots.map((p, i) => `<circle cx="${r.x - 5 + i * 3.2}" cy="${r.y + 9.6}" r="1.3" fill="${p.color}"/>`).join('')}
      <text x="${r.x}" y="${r.y + (gdots.length ? 14 : 10.6)}">${r.name}</text></g>`;
  }).join('');
  // panel de sala
  let panel = '';
  if (me.moving) {
    panel = `<div class="travel"><i id="travbar"></i></div><div class="center dim">🚶 Viajando a <b style="color:var(--txt)">${roomName(me.moving.to)}</b>…</div>`;
  } else if (cur) {
    const here = S.players.filter(p => p.here && p.id !== me.id);
    const darkN = S.players.filter(p => p.dark).length;
    const bodies = S.bodies.filter(b => b.room === cur);
    const tasksHere = me.tasks.filter(t => t.room === cur && !t.done);
    panel = `<h2>📍 ${roomName(cur)}</h2>`;
    if (!here.length && !darkN && !bodies.length) panel += `<div class="dim small">No hay nadie más aquí.</div>`;
    if (darkN) panel += `<div class="dim small">🌑 Alguien más está aquí, pero con el apagón no ves quién.</div>`;
    here.forEach(p => {
      let btns = '';
      if (!ghost && role === 'killer' && pById(p.id).role !== 'killer') btns += actBtn('🔪 Matar', me.killReadyAt, `api('kill',{target:'${p.id}'})`, 'danger');
      if (!ghost && role === 'detective') btns += actBtn('🔫 Disparar', me.shootReadyAt, `shoot('${p.id}')`) + actBtn('🔍 Escanear', me.scanReadyAt, `api('scan',{target:'${p.id}'})`);
      panel += `<div class="rowitem"><div class="grow">${chip(p)} ${p.role === 'killer' ? badge('killer') : ''}</div>${btns}</div>`;
    });
    bodies.forEach(b => { const p = pById(b.pid); panel += `<div class="rowitem"><div class="grow">☠️ Cuerpo de ${chip(p)}</div>${!ghost ? `<button class="sm red" style="background:#e0314f" onclick="api('report')">📢 Reportar</button>` : ''}</div>`; });
    tasksHere.forEach(t => { panel += `<div class="rowitem"><div class="grow">⭐ Tarea: ${taskName(t.type)}</div><button class="sm" style="background:#2563eb" onclick="startTask('${t.id}')">Hacer</button></div>`; });
    let extra = '';
    if (!ghost && role === 'killer') extra += actBtn('⚡ Apagón', me.sabReadyAt, `api('sabotage')`);
    if (!ghost && cur === 'cafe') extra += actBtn('🚨 Reunión', Math.max(me.canMeetingAt, me.meetingsLeft ? 0 : 9e15), `api('emergency')`);
    if (extra) panel += `<div class="acts">${extra}</div>`;
  }
  const scans = me.scans.map(s => `<span class="chip" style="color:${s.sus ? 'var(--red)' : 'var(--green)'}">${esc(pById(s.pid)?.name || '?')}: ${s.sus ? 'sospechoso' : 'limpio'}</span>`).join(' ');
  const mates = role === 'killer' ? S.players.filter(p => p.role === 'killer' && p.id !== me.id) : [];
  const rinfo = ROLE[role] || ROLE.innocent;
  const alive = S.players.filter(p => p.alive).length;

  setHTML('game', `
  <div class="rolebar"><span style="font-weight:800;color:${rinfo.c}">${rinfo.i} ${ghost ? '👻 Fantasma · ' : ''}${{ killer: 'Traidor', detective: 'Detective', innocent: 'Agente' }[role]}</span><span class="dim small">${alive} vivos · ⭐ ${me.score}</span></div>
  <div class="hud"><span class="small dim">TAREAS</span><div class="pbar"><i style="width:${pct}%"></i></div><b>${pct}%</b></div>
  <svg class="map" viewBox="0 0 100 100">${svg}</svg>
  <div class="card" style="margin-top:10px">${panel}</div>
  ${scans ? `<div class="card"><h2>Escaneos</h2>${scans}</div>` : ''}
  ${mates.length ? `<div class="card"><h2>Tus cómplices</h2>${mates.map(chip).join(' ')}</div>` : ''}
  <div class="card"><h2>${role === 'killer' ? 'Tareas falsas (aparenta)' : 'Tus tareas'}</h2>
    ${me.tasks.map(t => `<div class="task ${t.done ? 'done' : ''}"><span>${t.done ? '✔' : '⭐'} ${taskName(t.type)} — ${roomName(t.room)}</span></div>`).join('')}</div>
  <button class="btn ghost small" onclick="leave()" style="font-size:13px;padding:8px">Abandonar partida</button>`);
  $('#bo').style.display = S.blackoutUntil > now() && S.phase === 'play' ? 'flex' : 'none';
  renderReveal();
  tickUI();
}
const taskName = t => ({ seq: 'Secuencia numérica', reflex: 'Reflejos', memory: 'Memoria', math: 'Cálculo rápido' }[t]);
function move(to) { beep(600, .05); api('move', { to }); }
function shoot(id) { if (confirm('¿Disparar? Si no es un traidor, MORIRÁS.')) api('shoot', { target: id }); }
function renderReveal() {
  const el = $('#reveal');
  if (S.phase !== 'reveal') { if (el.innerHTML) el.innerHTML = ''; return; }
  if (el.innerHTML) return;
  const r = ROLE[S.me.role]; const mates = S.players.filter(p => p.role === 'killer' && p.id !== S.me.id);
  el.innerHTML = `<div class="ov"><div class="ovbox reveal"><div style="font-size:84px">${r.i}</div><div class="big" style="color:${r.c}">${r.t}</div>
    <p style="color:#c5cde6;line-height:1.5">${r.d}</p>
    ${mates.length ? `<div>Tus cómplices: ${mates.map(chip).join(' ')}</div>` : ''}
    <div class="dim small" style="margin-top:14px">${S.killersCount} traidor${S.killersCount > 1 ? 'es' : ''} entre ${S.players.length} jugadores · empieza en <b data-until="${S.phaseEnd}"></b></div></div></div>`;
}

// ---------- tick de UI (cooldowns, temporizadores, viaje) ----------
function tickUI() {
  if (!S) return;
  const n = now();
  document.querySelectorAll('[data-ready]').forEach(b => {
    const rem = Math.ceil((+b.dataset.ready - n) / 1000);
    b.disabled = rem > 0 || b.dataset.ready > 1e15;
    b.textContent = rem > 0 && b.dataset.ready < 1e15 ? `${b.dataset.label} (${rem}s)` : b.dataset.label;
  });
  document.querySelectorAll('[data-until]').forEach(e => { const s = Math.max(0, Math.ceil((+e.dataset.until - n) / 1000)); e.textContent = s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : s + 's'; });
  if (S.me.moving) {
    const m = S.me.moving, p = Math.min(1, Math.max(0, 1 - (m.arriveAt - n) / 2000));
    const tb = $('#travbar'); if (tb) tb.style.width = p * 100 + '%';
    const tv = $('#trav'); if (tv) { const [ax, ay] = tv.dataset.a.split(',').map(Number), [bx, by] = tv.dataset.b.split(',').map(Number); tv.setAttribute('cx', ax + (bx - ax) * p); tv.setAttribute('cy', ay + (by - ay) * p); }
  }
  if (S.phase === 'play') $('#bo').style.display = S.blackoutUntil > n ? 'flex' : 'none';
  if (mini && mini.tick) mini.tick();
}
setInterval(tickUI, 150);

// ---------- REUNIÓN ----------
function renderMeeting() {
  const M = S.meeting, me = S.me;
  if (mount('meet')) {
    $('#screen').innerHTML = `
    <div class="row" style="margin-bottom:6px"><div><div style="font-size:20px;font-weight:900;color:var(--yellow)" id="mtitle"></div><div class="dim small" id="mcaller"></div></div><div class="timer" style="text-align:right;flex:none" id="mtimer"></div></div>
    <div id="mhints"></div>
    <div class="card" style="padding:10px"><div class="pgrid" id="mpl"></div><div class="row" style="margin-top:8px"><button class="sm" id="mskip" onclick="vote('skip')">⏭ Saltar voto</button></div></div>
    <div class="card" style="padding:10px"><div class="chat" id="mchat"></div>
      <form id="mform" class="row" style="margin-top:8px" onsubmit="sendChat(event)"><input id="minput" maxlength="140" placeholder="Acusa o defiéndete…" autocomplete="off" style="flex:4"><button style="flex:1">➤</button></form></div>`;
  }
  $('#mtitle').textContent = M.reason === 'body' ? '📢 CUERPO REPORTADO' : '🚨 REUNIÓN DE EMERGENCIA';
  $('#mcaller').textContent = 'Convocada por ' + M.caller;
  $('#mtimer').innerHTML = S.phase === 'meeting' ? `<span data-until="${M.endAt}"></span>` : '';
  $('#mhints').innerHTML = M.hints.map(h => `<div class="hint">🔎 ${esc(h)}</div>`).join('');
  const voteOpen = S.phase === 'meeting' && me.alive;
  $('#mpl').innerHTML = S.players.map(p => {
    const voted = M.voted.includes(p.id);
    const mine = M.myVote === p.id;
    return `<div class="pcard ${p.alive ? '' : 'dead'} ${p.id === me.id ? 'mine' : ''}"><div class="nm"><i class="dot" style="background:${p.color};color:${p.color}"></i>${esc(p.name)} ${!p.alive ? '☠️' : ''}</div>
      <div class="small dim">${p.alive ? (voted ? '✔ ya votó' : 'indeciso') : 'eliminado'}</div>
      ${p.alive && p.id !== me.id ? `<button class="sm" ${voteOpen ? '' : 'disabled'} style="${mine ? 'background:#e0314f;border-color:#ff5c7a' : ''}" onclick="vote('${p.id}')">${mine ? '🗳 Votado' : 'Votar'}</button>` : ''}</div>`;
  }).join('');
  const sk = $('#mskip'); sk.disabled = !voteOpen; sk.style.background = M.myVote === 'skip' ? '#3b4a7a' : '';
  const chat = $('#mchat'); const bottom = chat.scrollTop + chat.clientHeight >= chat.scrollHeight - 30;
  chat.innerHTML = M.chat.length ? M.chat.map(c => `<div><b style="color:${c.c}">${esc(c.n)}:</b> ${esc(c.t)}</div>`).join('') : '<div class="dim">Nadie ha hablado aún. ¿Quién es sospechoso?</div>';
  if (bottom) chat.scrollTop = chat.scrollHeight;
  $('#mform').style.display = voteOpen ? 'flex' : 'none';
  if (!me.alive && S.phase === 'meeting' && !$('#ghostmsg')) $('#mform').insertAdjacentHTML('afterend', '<div id="ghostmsg" class="dim small center" style="margin-top:8px">👻 Eres un fantasma: puedes mirar, pero no hablar ni votar.</div>');
  // resultado
  if (S.phase === 'result') showResult(); else { const r = $('#mres'); if (r) r.remove(); }
  tickUI();
}
function vote(t) { beep(500, .06); api('vote', { target: t }); }
function sendChat(e) { e.preventDefault(); const i = $('#minput'); const t = i.value.trim(); if (!t) return; i.value = ''; api('chat', { text: t }); }
function showResult() {
  if ($('#mres')) return;
  const R = S.result, el = document.createElement('div'); el.id = 'mres'; el.className = 'ov';
  const votes = Object.entries(R.votes).map(([v, t], i) => `<div class="rline" style="animation-delay:${.8 + i * .35}s">${chip(pById(v))} → ${t === 'skip' ? '<span class="dim">saltar</span>' : chip(pById(t))}</div>`).join('') || '<div class="dim">Nadie votó.</div>';
  const t0 = .8 + Object.keys(R.votes).length * .35 + .6;
  let verdict;
  if (R.kind === 'eject') {
    const col = { killer: 'var(--red)', detective: 'var(--blue)', innocent: 'var(--green)' }[R.role];
    verdict = `<div class="rline" style="animation-delay:${t0}s;font-size:22px;margin-top:14px"><b>${esc(R.name)}</b> ha sido expulsado…</div>
    <div class="rline" style="animation-delay:${t0 + 1.6}s;font-size:30px;font-weight:900;color:${col};margin-top:6px">${{ killer: '¡ERA UN TRAIDOR! 🔪', detective: 'Era el DETECTIVE 🕵️', innocent: 'Era un agente inocente…' }[R.role]}</div>`;
  } else verdict = `<div class="rline" style="animation-delay:${t0}s;font-size:22px;margin-top:14px">${R.kind === 'tie' ? 'Empate: nadie es expulsado.' : 'Nadie ha sido expulsado.'}</div>`;
  el.innerHTML = `<div class="ovbox center"><h2>Resultado de la votación</h2>${votes}${verdict}</div>`;
  document.body.appendChild(el);
  const rm = new MutationObserver(() => { if (S.phase !== 'result') { el.remove(); rm.disconnect(); } });
  setTimeout(() => R.kind === 'eject' && beep(R.role === 'killer' ? 880 : 140, .6, 'triangle', .12), (t0 + 1.6) * 1000);
  const chk = setInterval(() => { if (!S || S.phase !== 'result') { el.remove(); clearInterval(chk); } }, 300);
}

// ---------- FIN ----------
function renderEnd() {
  const E = S.end, myTeam = S.me.role === 'killer' ? 'killers' : 'innocents', won = E.winner === myTeam;
  $('#reveal').innerHTML = ''; $('#bo').style.display = 'none'; closeMini();
  setHTML('end', `
  <div class="winner" style="color:${E.winner === 'killers' ? 'var(--red)' : 'var(--green)'}">${E.winner === 'killers' ? '🔪 GANAN LOS TRAIDORES' : '🛡️ GANAN LOS AGENTES'}</div>
  <div class="center dim">${esc(E.reason)}</div>
  <div class="center" style="margin:10px 0;font-size:22px;font-weight:800">${won ? '🏆 ¡Victoria!' : '💀 Derrota'}</div>
  <div class="card"><h2>Ranking</h2>${E.ranking.map((p, i) => `<div class="rank"><span class="n">${i + 1}</span><span class="dot" style="background:${p.color};color:${p.color}"></span>
    <div><b>${esc(p.name)}</b> ${badge(p.role)} ${p.alive ? '' : '☠️'}<div class="dim small">${p.kills ? p.kills + ' muertes · ' : ''}${p.tasks} tareas${p.correct ? ' · ' + p.correct + ' aciertos' : ''}</div></div>
    <span class="sc">${p.score}</span></div>`).join('')}</div>
  ${S.hostId === S.me.id ? `<button class="btn" onclick="api('again')">🔁 Volver a la sala</button>` : `<div class="center dim">El anfitrión puede iniciar otra ronda…</div>`}
  <div style="height:10px"></div><button class="btn ghost" onclick="leave()">Salir</button>`);
}

// ---------- MINIJUEGOS ----------
async function startTask(id) {
  const t = S.me.tasks.find(x => x.id === id); if (!t) return;
  const r = await api('task_start', { id });
  if (!r || r.error) return;
  openMini(t);
}
function closeMini() { if (mini) { mini.dead = true; mini = null; } $('#mini').innerHTML = ''; }
function cancelTask() { api('task_cancel'); closeMini(); }
function openMini(t) {
  const started = Date.now();
  mini = { id: t.id, tick() { if (S.phase !== 'play' || (Date.now() - started > 1500 && !S.me.doing)) closeMini(); } };
  const m = mini;
  const finish = () => {
    const wait = Math.max(0, 3200 - (Date.now() - started));
    setTimeout(async () => { if (m.dead) return; m.dead = true; beep(880, .15); await api('task_done', { id: t.id }); if (mini === m) closeMini(); }, wait);
  };
  $('#mini').innerHTML = `<div class="ov"><div class="ovbox card mini"><div class="row"><h3>${taskName(t.type)}</h3><button class="sm" style="flex:none" onclick="cancelTask()">✖ Cancelar</button></div><div class="dim small">${roomName(t.room)} · si te mueven o te atacan, se pierde</div><div id="mbody"></div></div></div>`;
  ({ seq: gSeq, reflex: gReflex, memory: gMemory, math: gMath })[t.type](m, finish);
}
function gSeq(m, done) {
  const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - .5); let next = 1;
  const b = $('#mbody'); b.innerHTML = `<div class="center" style="margin-top:10px">Toca del <b>1</b> al <b>9</b> en orden</div><div class="grid3">${nums.map(n => `<button data-n="${n}">${n}</button>`).join('')}</div>`;
  b.querySelectorAll('button').forEach(btn => btn.onclick = () => {
    if (m.dead) return;
    if (+btn.dataset.n === next) { btn.classList.add('ok'); beep(400 + next * 40, .06); if (++next > 9) done(); }
    else { beep(120, .15, 'square'); b.querySelector('.grid3').classList.remove('shake'); void b.offsetWidth; b.querySelector('.grid3').classList.add('shake'); next = 1; b.querySelectorAll('button').forEach(x => x.classList.remove('ok')); }
  });
}
function gReflex(m, done) {
  let wins = 0, timer = null, go = false, goAt = 0;
  const b = $('#mbody'); b.innerHTML = `<div class="center" style="margin-top:10px">Toca cuando se ponga <b style="color:var(--green)">verde</b> (3 veces)</div><div class="reflex" id="rf"></div><div class="center dim" id="rfmsg"></div>`;
  const c = $('#rf'), msg = $('#rfmsg');
  const round = () => {
    go = false; c.className = 'reflex'; c.textContent = 'ESPERA…'; msg.textContent = `Aciertos: ${wins}/3`;
    timer = setTimeout(() => { if (m.dead) return; go = true; goAt = Date.now(); c.className = 'reflex go'; c.textContent = '¡YA!'; beep(700, .1); timer = setTimeout(() => { if (go && !m.dead) { msg.textContent = 'Muy lento…'; round(); } }, 1100); }, 1200 + Math.random() * 2600);
  };
  c.onpointerdown = () => {
    if (m.dead) return; clearTimeout(timer);
    if (go) { wins++; beep(600, .08); if (wins >= 3) { c.textContent = '✔'; return done(); } round(); }
    else { msg.textContent = '¡Demasiado pronto!'; beep(120, .2, 'square'); round(); }
  };
  round();
}
function gMemory(m, done) {
  const cols = ['#ff4d6d', '#4dabf7', '#51cf66', '#ffd43b'], tones = [260, 330, 400, 520];
  let seq = [], pos = 0, accept = false;
  const b = $('#mbody'); b.innerHTML = `<div class="center" id="mmsg" style="margin-top:10px"></div><div class="pads">${cols.map((c, i) => `<button data-i="${i}" style="background:${c};color:${c}"></button>`).join('')}</div>`;
  const pads = [...b.querySelectorAll('button')], msg = $('#mmsg');
  const lit = async i => { pads[i].classList.add('lit'); beep(tones[i], .25); await new Promise(r => setTimeout(r, 380)); pads[i].classList.remove('lit'); await new Promise(r => setTimeout(r, 160)); };
  const play = async () => {
    seq = Array.from({ length: 5 }, () => Math.floor(Math.random() * 4)); pos = 0; accept = false; msg.textContent = 'Memoriza…';
    await new Promise(r => setTimeout(r, 600));
    for (const i of seq) { if (m.dead) return; await lit(i); }
    accept = true; msg.textContent = 'Tu turno';
  };
  pads.forEach(p => p.onclick = async () => {
    if (!accept || m.dead) return; const i = +p.dataset.i; lit(i);
    if (i === seq[pos]) { if (++pos >= seq.length) { accept = false; msg.textContent = '✔'; done(); } }
    else { accept = false; beep(120, .3, 'square'); msg.textContent = 'Fallaste. Otra vez…'; setTimeout(play, 900); }
  });
  play();
}
function gMath(m, done) {
  let streak = 0; const b = $('#mbody');
  const q = () => {
    const a = 3 + Math.floor(Math.random() * 12), c = 3 + Math.floor(Math.random() * 9), op = Math.random() < .5 ? '+' : '×';
    const ans = op === '+' ? a + c : a * c, set = new Set([ans]);
    while (set.size < 4) set.add(ans + Math.floor(Math.random() * 11) - 5 || ans + 7);
    const opts = [...set].sort(() => Math.random() - .5);
    b.innerHTML = `<div class="center dim" style="margin-top:10px">Acierta 3 seguidas · llevas ${streak}/3</div><div class="q">${a} ${op} ${c}</div><div class="opts">${opts.map(o => `<button data-o="${o}">${o}</button>`).join('')}</div>`;
    b.querySelectorAll('button').forEach(x => x.onclick = () => {
      if (m.dead) return;
      if (+x.dataset.o === ans) { beep(660, .07); if (++streak >= 3) { b.innerHTML = '<div class="q">✔</div>'; return done(); } }
      else { beep(120, .2, 'square'); streak = 0; }
      q();
    });
  };
  q();
}

// ---------- arranque ----------
if (sess) { connect(); $('#screen').innerHTML = '<div class="center dim" style="margin-top:40vh">Reconectando…</div>'; } else renderHome();
</script>
</body>
</html>
